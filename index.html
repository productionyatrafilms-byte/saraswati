    <script>
      // Keep the completed entrance transition when returning to this page.
      // This runs before the page is drawn, so the transition does not flash
      // or restart while coming back from a topic page.
      const INDEX_TRANSITION_KEY =
        "deviSaraswatiIndexTransitionCompleted";

      if (
        localStorage.getItem(
          INDEX_TRANSITION_KEY,
        ) === "true"
      ) {
        document.documentElement.classList.add(
          "restore-index-transition",
        );
      }
    </script>

    <style>
      html,
      body {
        overflow: hidden;
      }

      /* Show every entrance animation in its final state on a return visit. */
      .restore-index-transition *,
      .restore-index-transition *::before,
      .restore-index-transition *::after {
        animation-duration: 0.001s !important;
        animation-delay: -999s !important;
        transition-duration: 0s !important;
        transition-delay: 0s !important;
      }
    </style>

      name="viewport"
      content="width=device-width, initial-scale=1.0"

    <style>
      /* =========================================
         PLAY VIDEO BUTTON
         Moved here from assets/css/style.css.
         The background-image path is now relative to
         this file, not to the css folder.
         ========================================= */
      .video-play-btn {
        position: fixed;
        top: 2vw;
        left: 4vw;
        width: 14vw;
        height: 5vw;
        display: flex;
        align-items: center;
        justify-content: space-around;
        background-color: transparent;
        background-image: url("./assets/images/watch.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        cursor: pointer;
        pointer-events: auto;
        z-index: 1000;
        opacity: 1;
        transition: opacity 1.2s ease;
        gap: 1vw;
      }

      .video-play-btn span {
        font-weight: 400;
        font-family: "BerkshireSwash";
        color: #ffffff;
        font-size: 1.6vw;
        text-align: center;
        width: 100%;
        text-align: end;
        padding-right: 0.8vw;
      }

      /* Hidden once the entrance transition has run. */
      .page-content.design-animate .video-play-btn,
      .page-content.restored-stage-1 .video-play-btn,
      .page-content.restored-stage-2 .video-play-btn {
        opacity: 0;
        pointer-events: none;
      }

      /* Hindi label */
      body[data-lang="hi"] .video-play-btn span {
        font-family: "ITFDevanagari", sans-serif !important;
        font-weight: 700;
        font-size: 2vw !important;
      }

      /* Gujarati label */
      body[data-lang="gu"] .video-play-btn span {
        font-family: "NotoSansGujarati", sans-serif !important;
        font-weight: 400;
      }

      /* =========================================
         CUSTOM VIDEO PLAYER
         Change --player-accent to restyle in one place.
         ========================================= */
      :root {
        --player-accent: #ffe137;
        --player-accent-ink: #222222;
      }

      /* Blur the page behind the open popup. */
      body.video-open .page-content {
        filter: blur(0.5vw);
        pointer-events: none;
        user-select: none;
      }

      .video-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 0.9vw;
        overflow: hidden;
        background: #000;
      }

      .popup-video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }

      /* ---------- Center play button ---------- */
      .video-center-play {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6vw;
        min-width: 6vw;
        max-width: 6vw;
        height: 6vw;
        border: 0.22vw solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
        color: var(--player-accent);
        font-size: 2.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transform: translate(-50%, -50%) scale(1);
        z-index: 4;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          background 0.25s ease;
      }

      .video-center-play i {
        width: 2.2vw;
        min-width: 2.2vw;
        max-width: 2.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }

      .video-center-play.hide {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.8);
      }

      .video-center-play:hover {
        background: rgba(0, 0, 0, 0.55);
        transform: translate(-50%, -50%) scale(1.08);
      }

      /* ---------- Skip toasts ---------- */
      .seek-toast {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        padding: 0.6vw 1.1vw;
        border-radius: 0.6vw;
        background: rgba(0, 0, 0, 0.55);
        color: var(--player-accent);
        font-size: 1.1vw;
        font-weight: 700;
        font-family: Arial, sans-serif;
        opacity: 0;
        pointer-events: none;
        z-index: 6;
        transition: opacity 0.2s ease;
      }

      .seek-toast.show {
        opacity: 1;
      }

      .seek-toast.backward {
        left: 8%;
      }

      .seek-toast.forward {
        right: 8%;
      }

      /* ---------- Control bar ---------- */
      .custom-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 1vw;
        display: flex;
        flex-direction: column;
        gap: 0.75vw;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.82),
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0)
        );
        opacity: 1;
        transition: opacity 0.25s ease;
      }

      .video-frame.controls-hidden .custom-controls {
        opacity: 0;
        pointer-events: none;
      }

      .progress-wrap {
        width: 100%;
        display: flex;
        align-items: center;
        padding: 0.4vw 0;
        cursor: pointer;
      }

      /* Free seeking in both directions. */
      .video-progress {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        height: 0.45vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        overflow: hidden;
        pointer-events: auto;
        transition: height 0.2s ease;
      }

      .progress-wrap:hover .video-progress {
        height: 0.65vw;
      }

      .video-progress::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 1vw;
        height: 1vw;
        border-radius: 50%;
        background: var(--player-accent);
        box-shadow: -70vw 0 0 69.6vw var(--player-accent);
        cursor: pointer;
      }

      .video-progress::-moz-range-thumb {
        width: 1vw;
        height: 1vw;
        border: none;
        border-radius: 50%;
        background: var(--player-accent);
        cursor: pointer;
      }

      .video-progress::-moz-range-progress {
        height: 0.45vw;
        border-radius: 5vw;
        background: var(--player-accent);
      }

      .control-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1vw;
      }

      .control-left,
      .control-right {
        display: flex;
        align-items: center;
        gap: 0.8vw;
      }

      .control-btn {
        width: 2.8vw;
        min-width: 2.8vw;
        max-width: 2.8vw;
        height: 2.8vw;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
        font-size: 1.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.25s ease,
          color 0.25s ease,
          transform 0.25s ease;
      }

      .control-btn i {
        width: 1.4vw;
        min-width: 1.4vw;
        max-width: 1.4vw;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }

      .control-btn:hover {
        background: var(--player-accent);
        color: var(--player-accent-ink);
        transform: scale(1.08);
      }

      .control-btn:focus-visible,
      .video-center-play:focus-visible {
        outline: 0.2vw solid var(--player-accent);
        outline-offset: 0.2vw;
      }

      .time-text {
        color: #ffffff;
        font-size: 1.05vw;
        font-weight: 700;
        font-family: Arial, sans-serif;
        letter-spacing: 0.05vw;
        min-width: 8vw;
      }

      .volume-range {
        width: 7vw;
        appearance: none;
        -webkit-appearance: none;
        height: 0.4vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
      }

      .volume-range::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 0.9vw;
        height: 0.9vw;
        border-radius: 50%;
        background: var(--player-accent);
        cursor: pointer;
      }

      .volume-range::-moz-range-thumb {
        width: 0.9vw;
        height: 0.9vw;
        border: none;
        border-radius: 50%;
        background: var(--player-accent);
        cursor: pointer;
      }

      /* ---------- Fullscreen ---------- */
      .video-box:fullscreen {
        width: 100%;
        height: 100%;
        border-radius: 0;
        padding: 0;
        background: #000;
      }

      .video-box:fullscreen .video-frame {
        border-radius: 0;
      }

      .video-box:fullscreen .close-video {
        top: 1.5vw;
        right: 1.5vw;
      }

      @media (prefers-reduced-motion: reduce) {
        .video-center-play,
        .control-btn,
        .custom-controls,
        .seek-toast {
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>

    <script>
      // ===== Video Elements =====
      const popupVideo =
        document.getElementById("popupVideo");

      const videoFrame =
        document.getElementById("videoFrame");

      const videoBox =
        document.getElementById("videoBox");

      const videoOverlay =
        document.getElementById(
          "videoOverlay",
        );

      const closeVideo =
        document.getElementById("closeVideo");

      const videoPlayBtn =
        document.getElementById(
          "videoPlayBtn",
        );

      // ===== Player Controls =====
      const centerPlayBtn =
        document.getElementById(
          "centerPlayBtn",
        );

      const playPauseBtn =
        document.querySelector(
          ".play-pause-btn",
        );

      const rewindBtn =
        document.querySelector(".rewind-btn");

      const forwardBtn =
        document.querySelector(
          ".forward-btn",
        );

      const videoProgress =
        document.getElementById(
          "videoProgress",
        );

      const currentTimeText =
        document.querySelector(
          ".current-time",
        );

      const totalTimeText =
        document.querySelector(".total-time");

      const muteBtn =
        document.querySelector(".mute-btn");

      const volumeRange =
        document.querySelector(
          ".volume-range",
        );

      const fullscreenBtn =
        document.querySelector(
          ".fullscreen-btn",
        );

      const seekToastBack =
        document.querySelector(
          ".seek-toast.backward",
        );

      const seekToastFwd =
        document.querySelector(
          ".seek-toast.forward",
        );

      const playPauseIcon =
        playPauseBtn.querySelector("i");

      const centerPlayIcon =
        centerPlayBtn.querySelector("i");

      const muteIcon =
        muteBtn.querySelector("i");

      const fullscreenIcon =
        fullscreenBtn.querySelector("i");

      // Seeking is unrestricted. The user can move
      // freely forward and backward at any time.
      const SKIP_SECONDS = 10;

      let controlsTimer;
      let seekToastTimer;
      let lastVolume = 1;
      let isSeeking = false;

      // ===== Audio Files =====
      const englishAudio = new Audio(
        "./assets/audio/Eng.mpeg",
      );

      const hindiAudio = new Audio(
        "./assets/audio/Hin.mpeg",
      );

      const gujratiAudio = new Audio(
        "./assets/audio/Guj.mpeg",
      );

      const videoPlayAudio = new Audio(
        "./assets/audio/transition/1.mp3",
      );

      const flowerAudio = new Audio(
        "./assets/audio/transition/5.mp3",
      );

      const topicAudio = new Audio(
        "./assets/audio/topic_home-btn_back-btn/3.mp3",
      );

      const homeAudio = new Audio(
        "./assets/audio/pop.mp3",
      );

      // ===== Other Elements =====
      const englishBtn =
        document.querySelector(
          ".english-button",
        );

      const hindiBtn =
        document.querySelector(
          ".hindi-button",
        );

      const gujratiBtn =
        document.querySelector(
          ".gujrati-button",
        );

      const flower =
        document.querySelector(".flower");

      const flowerSpan =
        document.querySelector(
          ".center > span",
        );

      const topicLinks =
        document.querySelectorAll(".topic");

      const homeBtn =
        document.querySelector(".home-btn");

      // Remember that this page's entrance transition has already run.
      // Topic-page navigation does not clear this value.
      localStorage.setItem(
        INDEX_TRANSITION_KEY,
        "true",
      );

      // ===== Play Audio =====
      function playAudio(audio) {
        if (!audio) return;

        audio.pause();
        audio.currentTime = 0;

        audio
          .play()
          .catch(function (error) {
            console.log(
              "Audio play failed:",
              error,
            );
          });
      }

      // ===== Time Formatting =====
      function formatTime(time) {
        if (!time || isNaN(time))
          return "0:00";

        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);

        return (
          minutes +
          ":" +
          (seconds < 10 ? "0" : "") +
          seconds
        );
      }

      // ===== Update Play Icons =====
      function updateVideoState() {
        if (!popupVideo) return;

        if (popupVideo.paused) {
          playPauseIcon.className =
            "fa-solid fa-play";

          centerPlayIcon.className =
            "fa-solid fa-play";

          centerPlayBtn.classList.remove(
            "hide",
          );

          videoBox.classList.remove(
            "playing",
          );
        } else {
          playPauseIcon.className =
            "fa-solid fa-pause";

          centerPlayIcon.className =
            "fa-solid fa-pause";

          centerPlayBtn.classList.add("hide");

          videoBox.classList.add("playing");
        }
      }

      function togglePlay() {
        if (!popupVideo) return;

        if (popupVideo.paused) {
          popupVideo
            .play()
            .catch(function () {});
        } else {
          popupVideo.pause();
        }
      }

      // ===== Open and Play Video =====
      function openAndPlayVideo() {
        if (
          !popupVideo ||
          !videoOverlay ||
          !videoBox
        ) {
          return;
        }

        playAudio(videoPlayAudio);

        document.body.classList.add(
          "video-open",
        );

        // Support both possible CSS class names.
        videoOverlay.classList.add("show");
        videoOverlay.classList.add("active");

        videoBox.classList.add("show");
        videoBox.classList.add("active");

        popupVideo.currentTime = 0;
        popupVideo.volume = Number(
          volumeRange.value,
        );
        popupVideo.muted = false;

        videoProgress.value = 0;
        currentTimeText.textContent = "0:00";

        updateMuteIcon();
        updateVideoState();
        showControlsTemporarily();

        popupVideo
          .play()
          .then(function () {
            updateVideoState();
          })
          .catch(function (error) {
            console.log(
              "Video play failed:",
              error,
            );

            updateVideoState();
          });
      }

      // ===== Close Video Popup =====
      function closeVideoPopup() {
        if (
          !popupVideo ||
          !videoOverlay ||
          !videoBox
        ) {
          return;
        }

        popupVideo.pause();
        popupVideo.currentTime = 0;

        videoProgress.value = 0;
        currentTimeText.textContent = "0:00";

        videoOverlay.classList.remove("show");
        videoOverlay.classList.remove(
          "active",
        );

        videoBox.classList.remove("show");
        videoBox.classList.remove("active");
        videoBox.classList.remove("playing");

        document.body.classList.remove(
          "video-open",
        );

        if (document.fullscreenElement) {
          document
            .exitFullscreen()
            .catch(function () {});
        }

        updateVideoState();
      }

      // ===== Progress =====
      function updateProgress() {
        if (!popupVideo.duration) return;

        totalTimeText.textContent =
          formatTime(popupVideo.duration);

        if (isSeeking) return;

        videoProgress.value =
          (popupVideo.currentTime /
            popupVideo.duration) *
          100;

        currentTimeText.textContent =
          formatTime(popupVideo.currentTime);
      }

      // ===== Seeking (forward and backward) =====
      function showSeekToast(direction) {
        const toast =
          direction > 0
            ? seekToastFwd
            : seekToastBack;

        seekToastFwd.classList.remove("show");
        seekToastBack.classList.remove(
          "show",
        );

        toast.classList.add("show");

        clearTimeout(seekToastTimer);

        seekToastTimer = setTimeout(
          function () {
            toast.classList.remove("show");
          },
          600,
        );
      }

      function skipTime(seconds) {
        if (!popupVideo.duration) return;

        let newTime =
          popupVideo.currentTime + seconds;

        if (newTime < 0) newTime = 0;

        if (newTime > popupVideo.duration) {
          newTime = popupVideo.duration;
        }

        popupVideo.currentTime = newTime;

        updateProgress();
        showSeekToast(seconds);
        showControlsTemporarily();
      }

      function seekFromProgress() {
        if (!popupVideo.duration) return;

        const newTime =
          (Number(videoProgress.value) /
            100) *
          popupVideo.duration;

        popupVideo.currentTime = newTime;

        currentTimeText.textContent =
          formatTime(newTime);
      }

      function previewSeekTime() {
        if (!popupVideo.duration) return;

        const previewTime =
          (Number(videoProgress.value) /
            100) *
          popupVideo.duration;

        currentTimeText.textContent =
          formatTime(previewTime);
      }

      // ===== Volume =====
      function updateMuteIcon() {
        if (
          popupVideo.muted ||
          popupVideo.volume === 0
        ) {
          muteIcon.className =
            "fa-solid fa-volume-xmark";
        } else if (popupVideo.volume < 0.5) {
          muteIcon.className =
            "fa-solid fa-volume-low";
        } else {
          muteIcon.className =
            "fa-solid fa-volume-high";
        }
      }

      function toggleMute() {
        if (
          popupVideo.muted ||
          popupVideo.volume === 0
        ) {
          popupVideo.muted = false;
          popupVideo.volume =
            lastVolume || 1;

          volumeRange.value =
            popupVideo.volume;
        } else {
          lastVolume = popupVideo.volume;
          popupVideo.muted = true;
          volumeRange.value = 0;
        }

        updateMuteIcon();
      }

      function changeVolume() {
        const volumeValue = Number(
          volumeRange.value,
        );

        popupVideo.volume = volumeValue;
        popupVideo.muted = volumeValue === 0;

        if (volumeValue > 0) {
          lastVolume = volumeValue;
        }

        updateMuteIcon();
      }

      // ===== Fullscreen =====
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          videoBox
            .requestFullscreen()
            .catch(function () {});
        } else {
          document
            .exitFullscreen()
            .catch(function () {});
        }
      }

      function updateFullscreenIcon() {
        if (document.fullscreenElement) {
          fullscreenIcon.className =
            "fa-solid fa-compress";
        } else {
          fullscreenIcon.className =
            "fa-solid fa-expand";
        }
      }

      // ===== Auto-hide Controls =====
      function showControlsTemporarily() {
        videoFrame.classList.remove(
          "controls-hidden",
        );

        clearTimeout(controlsTimer);

        if (
          !popupVideo.paused &&
          !isSeeking
        ) {
          controlsTimer = setTimeout(
            function () {
              videoFrame.classList.add(
                "controls-hidden",
              );
            },
            2200,
          );
        }
      }

      // ===== Main Video Button =====
      if (videoPlayBtn) {
        videoPlayBtn.addEventListener(
          "click",
          function (event) {
            event.preventDefault();

            // Prevent another handler in app.js
            // from immediately pausing the video.
            event.stopImmediatePropagation();

            openAndPlayVideo();
          },
          true,
        );
      }

      // ===== Video Events =====
      if (popupVideo) {
        // Clicking the video toggles playback.
        popupVideo.addEventListener(
          "click",
          togglePlay,
        );

        popupVideo.addEventListener(
          "play",
          function () {
            updateVideoState();
            showControlsTemporarily();
          },
        );

        popupVideo.addEventListener(
          "pause",
          function () {
            updateVideoState();
            showControlsTemporarily();
          },
        );

        popupVideo.addEventListener(
          "ended",
          updateVideoState,
        );

        popupVideo.addEventListener(
          "timeupdate",
          updateProgress,
        );

        popupVideo.addEventListener(
          "loadedmetadata",
          updateProgress,
        );

        popupVideo.addEventListener(
          "durationchange",
          updateProgress,
        );

        popupVideo.addEventListener(
          "seeked",
          updateProgress,
        );

        popupVideo.addEventListener(
          "contextmenu",
          function (event) {
            event.preventDefault();
          },
        );

        // Double-click left half = back, right half = forward.
        popupVideo.addEventListener(
          "dblclick",
          function (event) {
            const rect =
              popupVideo.getBoundingClientRect();

            const clickX =
              event.clientX - rect.left;

            if (clickX < rect.width / 2) {
              skipTime(-SKIP_SECONDS);
            } else {
              skipTime(SKIP_SECONDS);
            }
          },
        );

        popupVideo.addEventListener(
          "error",
          function () {
            console.error(
              "The video could not be loaded. Check the file path and video format.",
            );
          },
        );
      }

      // ===== Control Buttons =====
      centerPlayBtn.addEventListener(
        "click",
        togglePlay,
      );

      playPauseBtn.addEventListener(
        "click",
        togglePlay,
      );

      rewindBtn.addEventListener(
        "click",
        function () {
          skipTime(-SKIP_SECONDS);
        },
      );

      forwardBtn.addEventListener(
        "click",
        function () {
          skipTime(SKIP_SECONDS);
        },
      );

      muteBtn.addEventListener(
        "click",
        toggleMute,
      );

      volumeRange.addEventListener(
        "input",
        changeVolume,
      );

      fullscreenBtn.addEventListener(
        "click",
        toggleFullscreen,
      );

      // ===== Progress Bar Drag / Click =====
      videoProgress.addEventListener(
        "pointerdown",
        function () {
          isSeeking = true;
        },
      );

      videoProgress.addEventListener(
        "input",
        function () {
          isSeeking = true;
          previewSeekTime();
        },
      );

      videoProgress.addEventListener(
        "change",
        function () {
          seekFromProgress();
          isSeeking = false;
          showControlsTemporarily();
        },
      );

      document.addEventListener(
        "pointerup",
        function () {
          if (isSeeking) {
            seekFromProgress();
            isSeeking = false;
            showControlsTemporarily();
          }
        },
      );

      videoFrame.addEventListener(
        "mousemove",
        showControlsTemporarily,
      );

      videoFrame.addEventListener(
        "click",
        showControlsTemporarily,
      );

      document.addEventListener(
        "fullscreenchange",
        updateFullscreenIcon,
      );

      // ===== Close Video Button =====
      if (closeVideo) {
        closeVideo.addEventListener(
          "click",
          function (event) {
            event.preventDefault();
            event.stopPropagation();

            closeVideoPopup();
          },
        );
      }

      // Close the popup by clicking outside
      // the video box.
      if (videoOverlay) {
        videoOverlay.addEventListener(
          "click",
          function (event) {
            if (
              event.target === videoOverlay
            ) {
              closeVideoPopup();
            }
          },
        );
      }

      // ===== Keyboard Shortcuts =====
      document.addEventListener(
        "keydown",
        function (event) {
          const isOpen =
            videoOverlay.classList.contains(
              "active",
            ) ||
            videoOverlay.classList.contains(
              "show",
            );

          if (!isOpen) return;

          if (event.key === "Escape") {
            closeVideoPopup();
            return;
          }

          if (event.code === "Space") {
            event.preventDefault();
            togglePlay();
          }

          if (event.key === "ArrowRight") {
            event.preventDefault();
            skipTime(SKIP_SECONDS);
          }

          if (event.key === "ArrowLeft") {
            event.preventDefault();
            skipTime(-SKIP_SECONDS);
          }

          if (
            event.key.toLowerCase() === "m"
          ) {
            toggleMute();
          }

          if (
            event.key.toLowerCase() === "f"
          ) {
            toggleFullscreen();
          }
        },
      );

      // ===== Language Audio =====
      if (englishBtn) {
        englishBtn.addEventListener(
          "click",
          function () {
            playAudio(englishAudio);
          },
        );
      }

      if (hindiBtn) {
        hindiBtn.addEventListener(
          "click",
          function () {
            playAudio(hindiAudio);
          },
        );
      }

      if (gujratiBtn) {
        gujratiBtn.addEventListener(
          "click",
          function () {
            playAudio(gujratiAudio);
          },
        );
      }

      // ===== Flower Audio =====
      if (flower) {
        flower.style.cursor = "pointer";

        flower.addEventListener(
          "click",
          function () {
            playAudio(flowerAudio);
          },
        );
      }

      if (flowerSpan) {
        flowerSpan.style.cursor = "pointer";

        flowerSpan.addEventListener(
          "click",
          function () {
            playAudio(flowerAudio);
          },
        );
      }

      // ===== Home Button =====
      if (homeBtn) {
        homeBtn.style.cursor = "pointer";

        homeBtn.addEventListener(
          "click",
          function (event) {
            event.preventDefault();

            // Only this page's home button resets the saved transition.
            localStorage.removeItem(
              INDEX_TRANSITION_KEY,
            );

            playAudio(homeAudio);

            setTimeout(function () {
              window.location.href =
                "index.html";
            }, 500);
          },
        );
      }

      // ===== Topic Links =====
      topicLinks.forEach(function (topic) {
        topic.addEventListener(
          "click",
          function (event) {
            event.preventDefault();

            const pageLink =
              topic.getAttribute("href");

            playAudio(topicAudio);

            setTimeout(function () {
              window.location.href =
                pageLink;
            }, 800);
          },
        );
      });

      updateVideoState();
      updateMuteIcon();
    </script>
  </body>
</html>
